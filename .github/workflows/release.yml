name: Prepare GitHub release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run version
      - run: npm run build
      - run: npm test
      - run: npm pack
      - run: npm run build:mcpb
      - run: node scripts/syncReleaseHashes.ts
      - uses: actions/upload-artifact@v4
        with:
          name: github-release-candidates
          path: |
            *.tgz
            *.mcpb
            server.json

# Deliberately no npm/registry publication or automatic tag creation.
# Maintainers inspect tested artifacts before attaching them to a GitHub release.
