name: Fork CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "coverage>=7,<8" "pytest>=8,<10" "ruff>=0.11,<1"
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run
      - run: node scripts/package-architecture.mjs
